<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Left: Mascot / Chef Chicken Emblem -->
  <g transform="translate(6, 4)">
    <!-- Outer Ring -->
    <circle cx="36" cy="36" r="35" fill="url(#badgeGrad)" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="36" cy="36" r="31" stroke="#F59E0B" stroke-dasharray="3 3" stroke-width="1" fill="none" opacity="0.6" />

    <!-- Chef Chicken Mascot -->
    <!-- Chef Hat -->
    <path d="M26 18 C22 18 20 15 21 12 C22 9 27 8 29 10 C32 6 39 6 42 10 C45 8 50 9 51 12 C52 15 50 18 46 18 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" />
    <rect x="25" y="17" width="22" height="4" rx="1" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" />
    <line x1="28" y1="19" x2="44" y2="19" stroke="#E11D48" stroke-width="1.5" />

    <!-- Chicken Head & Comb -->
    <path d="M33 13 C33 10 37 10 38 13 C39 11 41 11 41 14 Z" fill="#EF4444" />
    <circle cx="36" cy="25" r="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" />
    <!-- Beak -->
    <path d="M42 24 L48 26 L42 28 Z" fill="#F59E0B" stroke="#D97706" stroke-width="0.8" />
    <path d="M41 28 C41 30 39 31 37 31" stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Eye with wink -->
    <circle cx="38" cy="23" r="1.8" fill="#0F172A" />
    <circle cx="38.5" cy="22.5" r="0.6" fill="#FFFFFF" />

    <!-- Chicken Body & Chef Apron -->
    <path d="M24 35 C24 30 48 30 48 35 L52 48 C52 52 20 52 20 48 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" />
    <path d="M28 35 L44 35 L42 48 L30 48 Z" fill="#F59E0B" opacity="0.9" />

    <!-- Crossed Fork and Knife Badge at Bottom -->
    <path d="M22 55 L50 55" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />
    <text x="36" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="6.5" fill="#FBBF24" text-anchor="middle" letter-spacing="1">KASUR</text>
  </g>

  <!-- Right: Wordmark "TOP TASTE" -->
  <g transform="translate(86, 0)">
    <!-- Top Taste Headline -->
    <text x="0" y="34" font-family="'Lilita One', 'Impact', cursive" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="0.5">
      TOP TASTE
    </text>

    <!-- Subtitle: SHAWARMA & PIZZA -->
    <text x="1" y="54" font-family="'Lilita One', 'Impact', cursive" font-size="19" font-weight="900" fill="#E11D48" letter-spacing="1.2">
      SHAWARMA &amp; PIZZA
    </text>

    <!-- Small tag: DINING & TAKE AWAY • KASUR -->
    <g transform="translate(2, 63)">
      <rect x="0" y="0" width="220" height="12" rx="3" fill="#F59E0B" fill-opacity="0.15" />
      <text x="6" y="9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#B45309" letter-spacing="0.8">
        DINING &amp; TAKE AWAY • BALDIA CHOWK
      </text>
    </g>
  </g>
</svg>